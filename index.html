<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OFUNDS - Earn Live</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', sans-serif; font-size: 0.9rem; }
    .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%); }
    .balance-text { font-size: 2.25rem; font-weight: 900; letter-spacing: -1px; }
    .neon-glow { text-shadow: 0 0 20px rgb(234 179 8); }
    video { width: 100%; border-radius: 16px; background: #000; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen gradient-bg">

  <!-- AUTH SCREEN (unchanged) -->
  <!-- ... (keep the same auth, welcome, and tasks modals as in previous version) ... -->

  <!-- AIRTIME MODAL (unchanged) -->
  <div id="airtime-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
    <!-- same content as before -->
    <div class="bg-zinc-900 rounded-3xl max-w-lg w-full p-6">
      <div class="flex justify-between mb-6">
        <h3 class="font-bold text-xl">Buy Airtime & Data</h3>
        <button onclick="closeAirtimeModal()" class="text-2xl text-zinc-400">✕</button>
      </div>
      <!-- ... rest of airtime form ... -->
      <button onclick="buyAirtimeOrData()" id="buy-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 py-5 rounded-2xl font-bold text-lg flex items-center justify-center gap-3">
        <span id="buy-btn-text">BUY AIRTIME</span>
      </button>
    </div>
  </div>

  <!-- TRAVEL MODAL (unchanged) -->
  <!-- ... same as previous ... -->

  <!-- TRANSACTION HISTORY MODAL -->
  <div id="history-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
    <div class="bg-zinc-900 rounded-3xl max-w-lg w-full p-6 max-h-[90vh] overflow-auto">
      <div class="flex justify-between mb-6">
        <h3 class="font-bold text-xl">Transaction History</h3>
        <button onclick="closeHistoryModal()" class="text-2xl text-zinc-400">✕</button>
      </div>
      <div id="transactions-list" class="space-y-3"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden min-h-screen pb-12">
    <nav class="bg-zinc-900 px-5 py-4 flex justify-between items-center border-b border-zinc-800">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-yellow-400 rounded-2xl flex items-center justify-center">
          <i class="fa-solid fa-coins text-zinc-900 text-xl"></i>
        </div>
        <h1 class="font-black text-xl tracking-tighter">OFUNDS</h1>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="openHistoryModal()" class="text-zinc-400 hover:text-white">
          <i class="fa-solid fa-clock-rotate-left"></i>
        </button>
        <button onclick="logout()" class="text-zinc-400 hover:text-red-400">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </nav>

    <div class="p-5 max-w-5xl mx-auto">
      <h2 id="welcome-name" class="text-2xl font-bold">Welcome back</h2>
      <p class="text-zinc-400 text-sm">Watch videos to earn ₦500 each</p>

      <!-- Balance Card -->
      <div class="mt-6 bg-gradient-to-br from-zinc-900 to-zinc-800 border border-yellow-400/30 rounded-3xl p-6">
        <div class="flex justify-between items-start">
          <div>
            <p class="uppercase text-xs tracking-widest text-zinc-400">TOTAL BALANCE</p>
            <div class="flex items-baseline mt-2">
              <span class="text-3xl font-black text-yellow-400">₦</span>
              <span id="balance" class="balance-text neon-glow ml-1">0</span>
            </div>
          </div>
          <button onclick="toggleBalanceVisibility()" class="mt-1">
            <i class="fa-solid fa-eye text-xl text-zinc-400" id="eye-icon"></i>
          </button>
        </div>

        <div class="mt-4">
          <div class="flex justify-between text-xs text-zinc-400 mb-1">
            <span>Progress to ₦86,000</span>
            <span id="progress-text">0%</span>
          </div>
          <div class="h-2 bg-zinc-700 rounded-full overflow-hidden">
            <div id="progress-bar" class="h-2 bg-yellow-400 rounded-full transition-all" style="width: 0%"></div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-6">
          <button onclick="openTasksModal()" class="bg-emerald-500 py-6 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-emerald-600 transition">
            <i class="fa-solid fa-play"></i><span class="text-sm">WATCH VIDEOS</span>
          </button>
          <button onclick="openAirtimeModal()" class="bg-violet-500 py-6 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-violet-600 transition">
            <i class="fa-solid fa-mobile-screen-button"></i><span class="text-sm">AIRTIME/DATA</span>
          </button>
        </div>

        <button onclick="openTravelModal()" class="mt-4 w-full bg-orange-500 py-6 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-orange-600 transition">
          <i class="fa-solid fa-plane"></i><span>BOOK FLIGHT / HOTEL</span>
        </button>

        <button onclick="window.open('https://ofundwithdraw.netlify.app/', '_blank')" class="mt-4 w-full bg-sky-500 py-5 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-sky-600 transition">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> WITHDRAW
        </button>
      </div>

      <div class="mt-10">
        <h3 class="font-bold text-lg mb-4">What Users Say</h3>
        <div id="app-comments" class="space-y-4"></div>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let balance = 0;
    let transactions = [];
    const MAX_BALANCE = 86000;
    let isVisible = true;
    let currentVideoIndex = 0;
    let currentService = 0;
    let currentTravelTab = 0;

    const videos = [ /* your existing video list */ ];

    const appComments = [ /* your existing comments */ ];

    function saveUserData() {
      if (currentUser) {
        currentUser.balance = balance;
        currentUser.transactions = transactions;
        localStorage.setItem("ofunds_user", JSON.stringify(currentUser));
      }
    }

    function loadUserData() {
      const saved = localStorage.getItem("ofunds_user");
      if (saved) {
        currentUser = JSON.parse(saved);
        balance = currentUser.balance || 0;
        transactions = currentUser.transactions || [];
      }
    }

    function addTransaction(type, description, amount) {
      const tx = {
        id: Date.now(),
        date: new Date().toLocaleString('en-NG'),
        type, // "credit" or "debit"
        description,
        amount
      };
      transactions.unshift(tx); // newest first
      saveUserData();
    }

    function renderTransactions() {
      const container = document.getElementById('transactions-list');
      container.innerHTML = '';
      if (transactions.length === 0) {
        container.innerHTML = '<p class="text-zinc-400 text-center py-8">No transactions yet</p>';
        return;
      }
      transactions.forEach(tx => {
        const div = document.createElement('div');
        div.className = `flex justify-between items-center p-4 rounded-2xl ${tx.type === 'credit' ? 'bg-emerald-900/30' : 'bg-red-900/30'}`;
        div.innerHTML = `
          <div>
            <p class="font-medium">${tx.description}</p>
            <p class="text-xs text-zinc-400">${tx.date}</p>
          </div>
          <p class="${tx.type === 'credit' ? 'text-emerald-400' : 'text-red-400'} font-bold">
            \( {tx.type === 'credit' ? '+' : '-'}₦ \){tx.amount.toLocaleString('en-NG')}
          </p>
        `;
        container.appendChild(div);
      });
    }

    function openHistoryModal() {
      renderTransactions();
      document.getElementById('history-modal').classList.remove('hidden');
    }

    function closeHistoryModal() {
      document.getElementById('history-modal').classList.add('hidden');
    }

    function updateBalanceDisplay() {
      document.getElementById('balance').textContent = balance.toLocaleString('en-NG');
      const perc = Math.min((balance / MAX_BALANCE) * 100, 100);
      document.getElementById('progress-bar').style.width = `${perc}%`;
      document.getElementById('progress-text').textContent = `${Math.round(perc)}%`;
      saveUserData();
    }

    // Video earning
    function videoEnded() {
      document.getElementById('next-btn').classList.remove('hidden');
      if (balance < MAX_BALANCE) {
        balance += 500;
        addTransaction('credit', 'Video Task Completed', 500);
        updateBalanceDisplay();
      }
    }

    // Airtime / Data
    function buyAirtimeOrData() {
      const btn = document.getElementById('buy-btn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`;

      const phone = document.getElementById('phone-number').value.trim();
      if (!phone) {
        alert("Enter phone number");
        resetBuyBtn();
        return;
      }

      let amount = currentService === 0 
        ? parseInt(document.getElementById('airtime-amount').value) || 0 
        : parseInt(document.getElementById('data-plan').value) || 0;

      if (amount < 100) {
        alert("Minimum ₦100");
        resetBuyBtn();
        return;
      }
      if (balance < amount) {
        alert("Insufficient balance!");
        resetBuyBtn();
        return;
      }

      setTimeout(() => {
        balance -= amount;
        const serviceName = currentService === 0 ? 'Airtime' : 'Data';
        const network = document.getElementById('network-select').value;
        addTransaction('debit', `${serviceName} to \( {phone} ( \){network})`, amount);
        updateBalanceDisplay();
        alert(`✅ \( {serviceName} of ₦ \){amount} successfully sent to ${phone}`);
        closeAirtimeModal();
        resetBuyBtn();
      }, 1400);
    }

    function resetBuyBtn() {
      const btn = document.getElementById('buy-btn');
      btn.disabled = false;
      btn.innerHTML = `<span id="buy-btn-text">${currentService === 0 ? 'BUY AIRTIME' : 'BUY DATA'}</span>`;
    }

    // Flight & Hotel (similar improvements)
    function bookFlight() {
      // ... same logic as before
      setTimeout(() => {
        const amount = Math.floor(Math.random() * 45000) + 15000;
        if (balance >= amount) {
          balance -= amount;
          addTransaction('debit', `Flight Booking (LOS → ABV)`, amount);
          updateBalanceDisplay();
          showBookingResult(`Flight booked successfully!`, amount);
        } else alert("Insufficient balance");
      }, 1200);
    }

    // ... bookHotel similar ...

    function handleLogin() {
      // existing login code
      if (user.email === email && user.password === password) {
        currentUser = user;
        loadUserData();           // ← Fixed balance reset
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('welcome-modal').classList.remove('hidden');
      }
    }

    function continueToDashboard() {
      document.getElementById('welcome-modal').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('welcome-name').textContent = `Welcome, ${currentUser.firstname || 'User'}`;
      updateBalanceDisplay();
      renderAppComments();
    }

    function logout() {
      if (confirm("Logout?")) {
        saveUserData();
        location.reload();
      }
    }

    window.onload = () => {
      switchTab(0);
    };
  </script>
</body>
    </html>
