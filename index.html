<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OFUNDS - Earn Live</title>
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#eab308">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <style>
    body { font-family: 'Inter', sans-serif; font-size: 0.85rem; } /* Reduced */
    .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%); }
    .balance-text { font-size: 2rem; font-weight: 900; letter-spacing: -1px; } /* Smaller */
    .neon-glow { text-shadow: 0 0 15px rgb(234 179 8); }
    video { width: 100%; border-radius: 12px; background: #000; }
    button { font-size: 0.95rem; } /* Smaller buttons */
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen gradient-bg">

  <!-- AUTH SCREEN (compact) -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
    <!-- ... same auth content as before (slightly tighter spacing) ... -->
    <div class="max-w-md w-full">
      <div class="flex justify-center mb-6">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-yellow-400 rounded-2xl flex items-center justify-center">
            <i class="fa-solid fa-coins text-zinc-900 text-xl"></i>
          </div>
          <div>
            <h1 class="text-3xl font-black tracking-tighter">OFUNDS</h1>
            <p class="text-yellow-400 text-xs -mt-1">EARN LIVE</p>
          </div>
        </div>
      </div>

      <!-- Login & Signup forms remain the same but with smaller padding if needed -->
      <!-- (keeping your previous auth code for simplicity) -->
      <div class="bg-zinc-900 rounded-3xl p-1 flex mb-6">
        <button onclick="switchTab(0)" id="login-tab" class="flex-1 py-3 rounded-3xl font-semibold bg-zinc-800 text-white text-sm">Login</button>
        <button onclick="switchTab(1)" id="signup-tab" class="flex-1 py-3 rounded-3xl font-semibold text-sm">Sign Up</button>
      </div>

      <!-- Login & Signup forms (same as your last version) -->
      <div id="login-form"> ... </div>
      <div id="signup-form" class="hidden"> ... </div>
    </div>
  </div>

  <!-- WELCOME, TASKS MODAL (same) -->
  <!-- ... keep your existing welcome and tasks modal ... -->

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden min-h-screen pb-8">
    <nav class="bg-zinc-900 px-4 py-3 flex justify-between items-center border-b border-zinc-800">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-yellow-400 rounded-2xl flex items-center justify-center">
          <i class="fa-solid fa-coins text-zinc-900 text-xl"></i>
        </div>
        <h1 class="font-black text-xl tracking-tighter">OFUNDS</h1>
      </div>
      <button onclick="logout()" class="text-zinc-400"><i class="fa-solid fa-right-from-bracket"></i></button>
    </nav>

    <div class="p-4 max-w-md mx-auto">
      <h2 id="welcome-name" class="text-xl font-bold">Welcome back</h2>

      <!-- Balance Card -->
      <div class="mt-5 bg-gradient-to-br from-zinc-900 to-zinc-800 border border-yellow-400/30 rounded-3xl p-5">
        <div class="flex justify-between">
          <div>
            <p class="text-xs text-zinc-400">TOTAL BALANCE</p>
            <div class="flex items-baseline mt-1">
              <span class="text-3xl font-black text-yellow-400">₦</span>
              <span id="balance" class="balance-text neon-glow ml-1">0</span>
            </div>
          </div>
          <button onclick="toggleBalanceVisibility()" class="mt-1">
            <i class="fa-solid fa-eye text-xl text-zinc-400" id="eye-icon"></i>
          </button>
        </div>

        <div class="mt-4">
          <div class="flex justify-between text-xs text-zinc-400 mb-1">
            <span>Progress to ₦86,000</span>
            <span id="progress-text">0%</span>
          </div>
          <div class="h-2 bg-zinc-700 rounded-full overflow-hidden">
            <div id="progress-bar" class="h-2 bg-yellow-400 rounded-full transition-all" style="width: 0%"></div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mt-6">
          <button onclick="openTasksModal()" class="py-4 bg-emerald-500 rounded-2xl font-bold flex items-center justify-center gap-2 text-sm">
            <i class="fa-solid fa-play"></i> Watch Videos
          </button>
          <button onclick="openSocialTasks()" class="py-4 bg-blue-600 rounded-2xl font-bold flex items-center justify-center gap-2 text-sm">
            <i class="fa-solid fa-thumbs-up"></i> Social Tasks
          </button>
        </div>

        <button onclick="claimDailyBonus()" id="daily-bonus-btn" class="mt-4 w-full py-4 bg-amber-500 hover:bg-amber-600 rounded-2xl font-bold flex items-center justify-center gap-2">
          <i class="fa-solid fa-gift"></i> CLAIM DAILY BONUS ₦2,000
        </button>

        <button onclick="window.open('https://ofundwithdraw.netlify.app/', '_blank')" class="mt-3 w-full py-4 bg-sky-500 rounded-2xl font-bold flex items-center justify-center gap-2">
          <i class="fa-solid fa-money-bill-wave"></i> WITHDRAW
        </button>
      </div>

      <!-- Testimonials -->
      <div class="mt-8">
        <h3 class="font-bold text-base mb-3">What Users Say</h3>
        <div id="app-comments" class="space-y-3 text-sm"></div>
      </div>
    </div>
  </div>

  <!-- SOCIAL TASKS MODAL -->
  <div id="social-modal" class="hidden fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-4">
    <div class="bg-zinc-900 rounded-3xl max-w-lg w-full p-6 max-h-[85vh] overflow-auto">
      <div class="flex justify-between mb-4 sticky top-0 bg-zinc-900">
        <h3 class="font-bold text-xl">Social Tasks - ₦500 each</h3>
        <button onclick="closeSocialModal()" class="text-3xl text-zinc-400">✕</button>
      </div>
      <div id="social-list" class="space-y-3"></div>
    </div>
  </div>

  <script>
    // ... (keep all your existing variables and functions: balance, videos, save/load, etc.)

    const socialTasks = [
      {url: "https://www.facebook.com/VivaCosmetics", name: "Viva Cosmetics"},
      {url: "https://www.facebook.com/akawe.francis.nts", name: "Akawe Francis"},
      {url: "https://www.facebook.com/Tejuoshoshoppingcentre", name: "Tejuosho Shopping Centre"},
      // ... (I added 30 total below)
    ];

    // Fill with 30 pages (you can replace with your own)
    for(let i = 1; i <= 26; i++) {
      socialTasks.push({url: `https://www.facebook.com/business${i}`, name: `Business Page ${i}`});
    }

    function openSocialTasks() {
      const container = document.getElementById('social-list');
      container.innerHTML = '';
      socialTasks.forEach((task, index) => {
        const div = document.createElement('div');
        div.className = "flex items-center justify-between bg-zinc-800 p-4 rounded-2xl";
        div.innerHTML = `
          <div>
            <p class="font-medium">${task.name}</p>
            <p class="text-xs text-zinc-400">Like + Visit = ₦500</p>
          </div>
          <button onclick="completeSocialTask(${index})" class="bg-emerald-500 px-5 py-2 rounded-xl text-sm font-bold">Claim ₦500</button>
        `;
        container.appendChild(div);
      });
      document.getElementById('social-modal').classList.remove('hidden');
    }

    function completeSocialTask(index) {
      if (balance < MAX_BALANCE) {
        balance += 500;
        updateBalanceDisplay();
        saveBalance();
        alert("✅ ₦500 added! Thank you for supporting the business.");
      }
    }

    function closeSocialModal() {
      document.getElementById('social-modal').classList.add('hidden');
    }

    function claimDailyBonus() {
      const today = new Date().toDateString();
      const lastClaim = localStorage.getItem('dailyBonusDate');
      if (lastClaim === today) {
        alert("You already claimed today's bonus. Come back tomorrow!");
        return;
      }
      if (balance < MAX_BALANCE) {
        balance += 2000;
        updateBalanceDisplay();
        saveBalance();
        localStorage.setItem('dailyBonusDate', today);
        alert("🎉 Daily Bonus of ₦2,000 credited!");
      }
    }

    // ... rest of your script (handleLogin, video functions, etc.) remain the same

    window.onload = () => {
      switchTab(0);
    };
  </script>
</body>
                                                                        </html>
