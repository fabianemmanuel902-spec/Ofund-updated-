<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OFUNDS - Earn Live</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%); }
    .balance-text { font-size: 2.25rem; font-weight: 900; letter-spacing: -1px; }
    .neon-glow { text-shadow: 0 0 20px rgb(234 179 8); }
    video { width: 100%; border-radius: 16px; background: #000; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen gradient-bg">

  <!-- AUTH + WELCOME + DASHBOARD same as before (omitted for brevity) -->
  <!-- ... (keep the same auth, welcome modal, and dashboard from previous version) ... -->

  <!-- VIDEO TASKS MODAL -->
  <div id="tasks-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
    <div class="bg-zinc-900 rounded-3xl max-w-lg w-full p-6">
      <div class="flex justify-between mb-4">
        <h3 class="font-bold text-xl">Earn Live - Watch & Earn ₦500</h3>
        <button onclick="closeTasksModal()" class="text-2xl text-zinc-400">✕</button>
      </div>

      <div id="video-container" class="space-y-4">
        <video id="task-video" controls class="w-full rounded-2xl" onended="videoEnded()"></video>
        <div id="task-info" class="text-center text-sm text-zinc-400"></div>
      </div>

      <div class="flex gap-3 mt-6">
        <button onclick="closeTasksModal()" class="flex-1 py-4 border border-zinc-600 rounded-2xl">CLOSE</button>
        <button onclick="nextVideo()" id="next-btn" class="flex-1 py-4 bg-yellow-400 text-zinc-900 rounded-2xl font-bold hidden">NEXT VIDEO →</button>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let balance = 0;
    const MAX_BALANCE = 86000;
    let currentVideoIndex = 0;

    // ✅ ALL VIDEOS (Old + New)
    const videos = [
      { src: "fabric.mp4", title: "New Design Fabric" },
      { src: "car-loading.mp4", title: "Car Loading Service" },
      { src: "furniture.mp4", title: "Furniture Cleaning" },
      { src: "sandals.mp4", title: "Luxury Sandals Wholesale" },
      { src: "parfait.mp4", title: "MelonyPine Parfait" },
      { src: "skincare.mp4", title: "Cyncel Cosmetics Wholesale" },
      { src: "human-hair.mp4", title: "Hakuna Human Hair" },
      { src: "clothing.mp4", title: "Men's Fashion Collection" },
      { src: "rafiki.mp4", title: "Shop China Pay in Naira" }
    ];

    // Rest of the script (login, balance, etc.)
    function openTasksModal() {
      currentVideoIndex = 0;
      document.getElementById('tasks-modal').classList.remove('hidden');
      playCurrentVideo();
    }

    function playCurrentVideo() {
      const videoEl = document.getElementById('task-video');
      const info = document.getElementById('task-info');
      const nextBtn = document.getElementById('next-btn');

      const current = videos[currentVideoIndex % videos.length];
      videoEl.src = current.src;
      info.innerHTML = `<strong>Video \( {currentVideoIndex + 1}/ \){videos.length}</strong><br>${current.title}<br><span class="text-emerald-400">Watch to the end for ₦500</span>`;
      nextBtn.classList.add('hidden');
      videoEl.play().catch(() => {});
    }

    function videoEnded() {
      document.getElementById('next-btn').classList.remove('hidden');
      if (balance < MAX_BALANCE) {
        balance += 500;
        updateBalanceDisplay();
        alert(`✅ ₦500 credited! Watch next for more earnings.`);
      }
    }

    function nextVideo() {
      currentVideoIndex++;
      playCurrentVideo();
    }

    // ... (keep all other functions: handleLogin, updateBalanceDisplay, etc.)
  </script>
</body>
</html>
